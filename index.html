<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYBAC IBORO | AFROSKANKIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --yellow: #FEE600;
            --green: #1A5B2C;
            --red: #ED1C24;
            --black: #000000;
        }

        body {
            background-color: var(--yellow);
            font-family: 'Arial Black', Arial, Helvetica, sans-serif;
            color: var(--black);
            overflow-x: hidden;
        }

        .afroskankin-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.75;
            text-transform: uppercase;
            font-weight: 800;
            user-select: none;
        }

        .border-thick { border: 3px solid var(--black); }

        .btn-raw {
            border: 3px solid var(--black);
            background: var(--yellow);
            color: var(--black);
            transition: all 0.2s;
        }

        .btn-raw:hover {
            background: var(--red);
            color: var(--black);
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 360px;
            height: 100vh;
            background: var(--yellow);
            border-left: 3px solid var(--black);
            transition: right 0.3s ease-in-out;
            z-index: 1000;
            padding: 1.25rem;
            box-shadow: -10px 0 0 rgba(0,0,0,0.1);
            overflow-y: auto;
            box-sizing: border-box;
        }

        .cart-drawer.open { right: 0; }

        .product-card {
            border: 3px solid var(--black);
            background: white;
            transition: transform 0.2s;
        }

        .product-card:hover { transform: translateY(-5px); }

        /* Hero: show the complete video on desktop, keep mobile full-screen */
        .hero-section {
            width: 100%;
            height: 100vh;
            min-height: 0;
            background: var(--yellow);
            border-bottom: 3px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 767px) {
            .hero-video {
                object-fit: cover;
            }
        }

    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-yellow-400 p-4 border-b-3 border-black flex justify-between items-center" style="background-color: #FEE600;">
        <a href="#top" class="flex items-center"><img src="./logo.png" alt="Paybac Iboro" style="height:58px; width:auto; object-fit:contain; display:block;"></a>
        <div class="flex gap-6 items-center">
            <span class="font-semibold cursor-pointer underline">SHOP</span>
            <button onclick="toggleCart()" class="font-semibold border-2 border-black px-4 py-1" id="cart-btn">CART (0)</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <video id="hero-video" class="hero-video" autoplay muted loop playsinline>
            Your browser does not support video playback.
        </video>
    </section>

    <script>
        fetch('https://api.github.com/repos/oluwadaraadedayo-creator/Afroskankin/contents')
            .then(response => response.json())
            .then(files => {
                const videoFile = files.find(file =>
                    file.name.toLowerCase().includes('models_walking_runway') &&
                    file.name.toLowerCase().endsWith('.mp4')
                );

                if (videoFile) {
                    const video = document.getElementById('hero-video');
                    video.src = videoFile.download_url;
                    video.load();
                    video.play().catch(() => {});
                }
            })
            .catch(error => console.error('Hero video could not be loaded:', error));
    </script>

    <!-- Merch Grid -->
    <section class="p-5 md:p-8 max-w-6xl mx-auto">
        <h2 class="text-4xl md:text-6xl mb-12 uppercase italic underline">Catalog</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="product-grid">
            <!-- Product 1 -->
            <div class="product-card p-3">
                <div class="bg-gray-200 h-56 mb-4 flex items-center justify-center font-semibold">IMAGE AREA</div>
                <h3 class="text-2xl font-semibold uppercase">Signature Tee</h3>
                <p class="text-xl mb-2">₦25,000</p>
                <select class="w-full p-2 mb-4 border-2 border-black bg-white">
                    <option>S</option><option>M</option><option>L</option><option>XL</option>
                </select>
                <button onclick="addToCart('Signature Tee', 25000)" class="w-full p-2 btn-raw uppercase text-sm font-semibold">Add to Cart</button>
            </div>
            <!-- Product 2 -->
            <div class="product-card p-3">
                <div class="bg-gray-200 h-56 mb-4 flex items-center justify-center font-semibold">IMAGE AREA</div>
                <h3 class="text-2xl font-semibold uppercase">Classic Hoodie</h3>
                <p class="text-xl mb-2">₦45,000</p>
                <select class="w-full p-2 mb-4 border-2 border-black bg-white">
                    <option>S</option><option>M</option><option>L</option><option>XL</option>
                </select>
                <button onclick="addToCart('Classic Hoodie', 45000)" class="w-full p-3 btn-raw uppercase font-semibold">Add to Cart</button>
            </div>
            <!-- Product 3 -->
            <div class="product-card p-3">
                <div class="bg-gray-200 h-56 mb-4 flex items-center justify-center font-bold">IMAGE AREA</div>
                <h3 class="text-2xl font-semibold uppercase">Embroidered Cap</h3>
                <p class="text-xl mb-2">₦18,000</p>
                <select class="w-full p-2 mb-4 border-2 border-black bg-white">
                    <option>One Size</option>
                </select>
                <button onclick="addToCart('Embroidered Cap', 18000)" class="w-full p-3 btn-raw uppercase font-bold">Add to Cart</button>
            </div>
        </div>
    </section>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="cart-drawer">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-semibold uppercase">Your Bag</h2>
            <button onclick="toggleCart()" class="text-2xl font-semibold">X</button>
        </div>
        <div id="cart-items" class="space-y-3 mb-5"></div>
        <div class="border-t-3 border-black pt-4">
                <div class="border-2 border-black p-3 mb-3 bg-white">
                    <div class="flex justify-between font-semibold"><span>Items Total</span><span>₦<span id="items-total">0</span></span></div>
                    <div class="flex justify-between font-semibold mt-2"><span>Dispatch</span><span>₦<span id="delivery-fee">0</span></span></div>
                    <div class="flex justify-between font-semibold text-xl mt-2 border-t-2 border-black pt-2"><span>Total</span><span>₦<span id="order-grand-total">0</span></span></div>
                </div>
                <form id="checkout-form" class="space-y-3">
                <input type="text" placeholder="Full Name" class="w-full p-2 border-2 border-black" required>
                <input type="email" placeholder="Email" class="w-full p-2 border-2 border-black" required>
                <input type="text" placeholder="Phone" class="w-full p-2 border-2 border-black" required>
                <input id="delivery-address" type="text" placeholder="Address" class="w-full p-2 border-2 border-black" required>
                <input id="delivery-city" type="text" placeholder="City" class="w-full p-2 border-2 border-black" required>
                <button type="submit" id="pay-now" class="w-full p-3 btn-raw font-extrabold text-lg uppercase">Pay Now (Paystack Placeholder)</button>
            </form>
        </div>
    </div>

    <script>
        let cart = [];
        let deliveryFee = 0;
        let deliveryDistanceKm = null;
        const DELIVERY_API_URL = 'https://afroskankin-delivery-api.netlify.app/api/delivery-quote';

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const countEl = document.getElementById('cart-btn');
            const itemsTotalEl = document.getElementById('items-total');
            const deliveryFeeEl = document.getElementById('delivery-fee');
            const grandTotalEl = document.getElementById('order-grand-total');

            container.innerHTML = '';

            const itemsTotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
            const grandTotal = itemsTotal + Number(deliveryFee || 0);

            cart.forEach((item, index) => {
                container.innerHTML += `
                    <div class="flex justify-between items-center border-b-2 border-black pb-2 gap-3">
                        <div class="flex-1">
                            <div>${item.name}</div>
                            <div>₦${Number(item.price).toLocaleString()}</div>
                        </div>
                        <button type="button" data-remove-index="${index}" class="remove-cart-item border-2 border-black px-1.5 py-0.5 text-xs font-semibold" aria-label="Remove ${item.name}">REMOVE</button>
                    </div>
                `;
            });

            itemsTotalEl.textContent = itemsTotal.toLocaleString();
            deliveryFeeEl.textContent = Number(deliveryFee || 0).toLocaleString();
            grandTotalEl.textContent = grandTotal.toLocaleString();
            countEl.textContent = `CART (${cart.length})`;
        }

        function calculateDeliveryFee(distanceKm) {
            if (distanceKm <= 5) return 4000;
            if (distanceKm <= 10) return 8000;
            if (distanceKm <= 15) return 12000;
            if (distanceKm <= 20) return 18000;
            return 18000 + Math.ceil((distanceKm - 20) / 0.5) * 1000;
        }

        async function calculateDelivery() {
            const address = document.getElementById('delivery-address').value.trim();
            const city = document.getElementById('delivery-city').value.trim();
            const feeEl = document.getElementById('delivery-fee');

            if (!address || !city) {
                deliveryFee = 0;
                deliveryDistanceKm = null;
                feeEl.innerText = '0';
                updateCartUI();
                return;
            }

            const fullAddress = address + ', ' + city + ', Nigeria';

            try {
                const response = await fetch(DELIVERY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: fullAddress })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Backend unavailable');

                deliveryFee = data.deliveryFee;
                deliveryDistanceKm = data.distanceKm;
            } catch (error) {
                try {
                    const origin = await fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent('31 Alhaji Mosobolaje Street off Ago Palace Way Okota Isolo, Lagos, Nigeria') + '&limit=1').then(r => r.json());
                    const destination = await fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(fullAddress) + '&limit=1').then(r => r.json());

                    const originCoords = origin?.features?.[0]?.geometry?.coordinates;
                    const destinationCoords = destination?.features?.[0]?.geometry?.coordinates;
                    if (!originCoords || !destinationCoords) throw new Error('Address not found');

                    const route = await fetch('https://router.project-osrm.org/route/v1/driving/' + originCoords[0] + ',' + originCoords[1] + ';' + destinationCoords[0] + ',' + destinationCoords[1] + '?overview=false').then(r => r.json());
                    const distanceKm = route?.routes?.[0]?.distance / 1000;
                    if (!Number.isFinite(distanceKm)) throw new Error('Route not found');

                    deliveryDistanceKm = Number(distanceKm.toFixed(2));
                    deliveryFee = calculateDeliveryFee(distanceKm);
                } catch (fallbackError) {
                    deliveryFee = 0;
                    deliveryDistanceKm = null;
                }
            }

            feeEl.innerText = deliveryFee.toLocaleString();
            updateCartUI();
        }

        document.getElementById('cart-items').addEventListener('click', function(event) {
            const removeButton = event.target.closest('.remove-cart-item');
            if (!removeButton) return;
            event.preventDefault();
            const index = Number(removeButton.dataset.removeIndex);
            if (!Number.isInteger(index) || index < 0 || index >= cart.length) return;
            cart.splice(index, 1);
            updateCartUI();
        });

        document.getElementById('delivery-address').addEventListener('input', calculateDelivery);
        document.getElementById('delivery-city').addEventListener('input', calculateDelivery);
        document.getElementById('delivery-address').addEventListener('blur', calculateDelivery);
        document.getElementById('delivery-city').addEventListener('blur', calculateDelivery);

        updateCartUI();

    </script>
</body>
</html>
