<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>CART | AFROSKANKIN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
:root{--k:#050505;--w:#f4f1e8;--y:#FEE600}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--w);color:#000;font-family:'Anton',Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}
.top{height:48px;background:#050505;color:#f4f1e8;display:flex;align-items:center;justify-content:center}.menu{width:100%;height:48px;display:flex;align-items:center;justify-content:center;gap:24px;font-size:11px;letter-spacing:.12em}.menu a:hover{color:var(--y)}
.cart-page{min-height:calc(100vh - 48px);padding:86px 5vw 110px}.cart-inner{max-width:1180px;margin:0 auto}.cart-head{text-align:center;margin-bottom:55px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:700;margin-bottom:14px}.cart-title{font-size:clamp(55px,9vw,120px);line-height:.78;letter-spacing:-.08em;font-weight:400;margin:0;text-transform:uppercase}.cart-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.7fr);gap:55px}.cart-items{border-top:2px solid #000}.cart-item{display:grid;grid-template-columns:150px 1fr auto;gap:22px;align-items:center;padding:22px 0;border-bottom:1px solid #000}.placeholder{height:150px;background:#111;color:#f4f1e8;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px}.placeholder span{font-size:27px;line-height:.8;letter-spacing:-.05em;text-transform:uppercase}.item-name{font-size:20px;line-height:1;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px}.item-type{font-family:Arial,Helvetica,sans-serif;font-size:11px;margin-top:8px;color:#555;text-transform:uppercase}.item-price{font-size:15px;margin-top:15px}.qty{display:flex;align-items:center;border:1px solid #000;width:max-content;margin-top:15px}.qty button{width:32px;height:30px;border:0;background:transparent;cursor:pointer}.qty span{width:35px;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:12px}.item-total{text-align:right;font-size:15px}.remove{display:block;border:0;background:transparent;text-decoration:underline;text-transform:uppercase;font-size:10px;padding:0;margin-top:12px;cursor:pointer}
.summary{background:#111;color:#f4f1e8;padding:28px;align-self:start;position:sticky;top:20px}.summary h2{font-size:24px;font-weight:400;margin:0 0 28px;text-transform:uppercase}.sum-row{display:flex;justify-content:space-between;border-top:1px solid #555;padding:13px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px}.sum-total{font-family:'Anton',Arial,Helvetica,sans-serif;font-size:24px;border-top:2px solid #f4f1e8}.checkout{display:grid;gap:9px;margin-top:22px}.checkout input{height:43px;border:1px solid #777;background:#fff;padding:9px;font-family:Arial,Helvetica,sans-serif;font-size:12px}.pay{height:45px;background:var(--y);border:0;color:#000;cursor:pointer;text-transform:uppercase;font-size:12px}.continue{display:block;margin-top:18px;text-align:center;border-bottom:1px solid #f4f1e8;padding-bottom:6px;font-size:10px;text-transform:uppercase}
.empty{text-align:center;padding:80px 20px;border-top:2px solid #000;border-bottom:1px solid #000}.empty h2{font-size:34px;font-weight:400;margin:0 0 12px}.empty p{font-family:Arial,Helvetica,sans-serif;font-size:13px}
@media(max-width:800px){.menu a{display:none}.cart-page{padding:60px 18px 80px}.cart-layout{grid-template-columns:1fr;gap:35px}.cart-item{grid-template-columns:95px 1fr;gap:14px}.placeholder{height:110px}.placeholder span{font-size:21px}.item-total{grid-column:2;text-align:left}.summary{position:static}.cart-title{font-size:22vw}}
</style>
</head>
<body>
<header class="top"><nav class="menu"><a href="index.html#home">HOME</a><a href="index.html#gallery">GALLERY</a><a href="index.html#shop">MERCH</a><a href="cart.html">CART</a><a href="index.html#contact">CONTACT</a></nav></header>
<main class="cart-page">
<div class="cart-inner">
<div class="cart-head"><div class="eyebrow">AFROSKANKIN</div><h1 class="cart-title">YOUR CART</h1></div>
<div id="cartContent"></div>
</div>
</main>
<script>
const products=[
{name:'AFROSKANKIN Vinyl',type:'Vinyl',price:50000,label:'AFROSKANKIN VINYL'},
{name:'AFROSKANKIN Shirt',type:'Shirt',price:15000,label:'AFROSKANKIN SHIRT'},
{name:'AFROSKANKIN CD',type:'CD',price:10000,label:'AFROSKANKIN CD'},
{name:'AFROSKANKIN Book',type:'Book',price:10000,label:'AFROSKANKIN BOOK'}
];
let cart=JSON.parse(localStorage.getItem('afroskankinCart')||'[]');
function save(){localStorage.setItem('afroskankinCart',JSON.stringify(cart))}
function money(n){return '₦'+n.toLocaleString()}
function change(i,d){cart[i].qty=Math.max(1,(cart[i].qty||1)+d);save();render()}
function removeItem(i){cart.splice(i,1);save();render()}
function render(){
 const root=document.getElementById('cartContent');
 if(!cart.length){root.innerHTML='<div class="empty"><h2>YOUR CART IS EMPTY</h2><p>Choose something from the AFROSKANKIN merch collection.</p><a class="continue" href="index.html#shop">CONTINUE SHOPPING</a></div>';return}
 const subtotal=cart.reduce((s,x)=>s+x.price*(x.qty||1),0);
 root.innerHTML='<div class="cart-layout"><section class="cart-items">'+cart.map((x,i)=>'<article class="cart-item"><div class="placeholder"><span>'+x.label+'</span></div><div><div class="item-name">'+x.name+'</div><div class="item-type">'+x.type+'</div><div class="item-price">'+money(x.price)+'</div><div class="qty"><button onclick="change('+i+',-1)">−</button><span>'+(x.qty||1)+'</span><button onclick="change('+i+',1)">+</button></div></div><div class="item-total">'+money(x.price*(x.qty||1))+'<button class="remove" onclick="removeItem('+i+')">Remove</button></div></article>').join('')+'</section><aside class="summary"><h2>Order Summary</h2><div class="sum-row"><span>Items</span><span>'+money(subtotal)+'</span></div><div class="sum-row"><span>Dispatch</span><span>Calculated at checkout</span></div><div class="sum-row sum-total"><span>Total</span><span>'+money(subtotal)+'</span></div><form class="checkout" onsubmit="checkout(event)"><input placeholder="Full Name" required><input type="email" placeholder="Email" required><input placeholder="Phone" required><input placeholder="Address" required><input placeholder="City" required><button class="pay">PAY NOW</button></form><a class="continue" href="index.html#shop">Continue Shopping</a></aside></div>'
}
function checkout(e){e.preventDefault();alert('Paystack checkout will be connected here.')}
render();
</script>
</body>
</html>
