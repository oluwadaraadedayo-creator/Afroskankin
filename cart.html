<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FEE600">
<title>CART | AFROSKANKIN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
:root{--y:#FEE600;--k:#050505;--w:#F4F1E8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--y);color:#000;font-family:'Anton',Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
button,input{font-family:'Anton',Arial,Helvetica,sans-serif}
.top{width:100vw;height:118px;padding:0;margin:0;display:flex;align-items:flex-start;justify-content:center;background:#808080 !important;color:var(--w);box-sizing:border-box}
.top-inner{width:100vw;height:100%;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:0;background:#808080 !important;box-sizing:border-box}
.brand-center{height:70px;width:100vw;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:#808080 !important;box-sizing:border-box}
.top img{height:44px;width:auto}
.menu{width:100vw;height:48px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:24px;font-size:14px;font-weight:700;letter-spacing:.12em;background:#050505 !important;color:#f4f1e8;box-sizing:border-box}
.menu a:hover{color:var(--y)}
.cart-page{min-height:calc(100vh - 118px);padding:72px 5vw 100px}
.cart-inner{max-width:1380px;margin:0 auto}
.cart-head{text-align:center;margin-bottom:55px}
.eyebrow{font-size:11px;letter-spacing:.16em;margin-bottom:15px}
.cart-title{font-size:clamp(55px,8vw,120px);line-height:.78;letter-spacing:-.08em;font-weight:400;margin:0;text-transform:uppercase}
.cart-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(340px,.65fr);gap:50px;align-items:start}
.cart-items{border-top:2px solid #000}
.cart-item{display:grid;grid-template-columns:180px 1fr 150px;gap:28px;align-items:center;padding:25px 0;border-bottom:1px solid #000}
.placeholder{height:180px;background:var(--k);color:var(--y);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
.placeholder span{font-size:30px;line-height:.82;letter-spacing:-.05em;text-transform:uppercase}
.item-name{font-size:24px;line-height:1;text-transform:uppercase;text-decoration:underline;text-underline-offset:6px}
.item-type{font-size:11px;letter-spacing:.08em;margin-top:9px;text-transform:uppercase}
.item-price{font-size:16px;margin-top:17px}
.qty{display:flex;align-items:center;border:2px solid #000;width:max-content;margin-top:17px;height:38px}
.qty button{width:38px;height:34px;border:0;background:transparent;color:#000;cursor:pointer;font-size:16px}
.qty button:hover{background:#000;color:var(--y)}
.qty span{width:42px;text-align:center;font-size:13px}
.item-total{text-align:right;font-size:17px}
.remove{display:block;border:0;background:transparent;text-decoration:underline;text-transform:uppercase;font-size:10px;padding:0;margin:13px 0 0 auto;cursor:pointer}
.remove:hover{background:#000;color:var(--y)}
.summary{background:var(--k);color:var(--y);padding:30px;align-self:start;position:sticky;top:20px}
.summary h2{font-size:27px;font-weight:400;margin:0 0 25px;text-transform:uppercase}
.coupon-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0 0 10px}
.coupon-row input{min-width:0;height:43px;border:2px solid var(--y);background:var(--w);color:#000;padding:9px 11px;font-size:12px;outline:none}
.coupon-row button,.update-cart{height:43px;background:transparent;border:2px solid var(--y);color:var(--y);padding:0 15px;cursor:pointer;text-transform:uppercase;font-size:11px}
.coupon-row button:hover,.update-cart:hover{background:var(--y);color:#000}
.update-cart{width:100%;margin:0 0 24px}
.shipping{border-top:1px solid #555;padding-top:20px;margin-top:5px}
.shipping h3{font-size:18px;font-weight:400;margin:0 0 14px;text-transform:uppercase}
.shipping-option{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #555;font-family:Arial,Helvetica,sans-serif}
.shipping-option input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--y);flex:0 0 auto}
.shipping-option label{font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.35;color:var(--w);cursor:pointer}
.shipping-option strong{display:block;font-family:'Anton',Arial,Helvetica,sans-serif;font-size:13px;color:var(--y);font-weight:400;margin-bottom:3px}
.address-box{margin-top:18px;border:1px solid #555;padding:14px}
.address-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.address-value{font-family:Arial,Helvetica,sans-serif;color:var(--w);font-size:11px;line-height:1.4;min-height:18px}
.change-address{margin-top:12px;height:35px;background:transparent;border:1px solid var(--y);color:var(--y);padding:0 12px;cursor:pointer;text-transform:uppercase;font-size:10px}
.change-address:hover{background:var(--y);color:#000}
.address-form{display:none;gap:8px;margin-top:12px}
.address-form.open{display:grid}
.address-form input{width:100%;height:40px;border:1px solid var(--y);background:var(--w);color:#000;padding:8px;font-family:Arial,Helvetica,sans-serif;font-size:11px;outline:none}
.sum-row{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #555;padding:14px 0;font-size:13px}
.sum-total{font-size:25px;border-top:2px solid var(--y);margin-top:4px;padding-top:16px}
.checkout{display:grid;gap:9px;margin-top:20px}
.pay{height:50px;background:var(--y);border:0;color:#000;cursor:pointer;text-transform:uppercase;font-size:13px;margin-top:2px}
.pay:hover{background:var(--w)}
.checkout-note{font-family:Arial,Helvetica,sans-serif;color:#aaa;font-size:10px;line-height:1.4;margin-top:8px}
.continue{display:block;margin-top:19px;text-align:center;border-bottom:1px solid var(--y);padding-bottom:7px;font-size:10px;text-transform:uppercase}
.empty{text-align:center;padding:80px 20px;border-top:2px solid #000;border-bottom:1px solid #000}
.empty h2{font-size:38px;font-weight:400;margin:0 0 14px}
.empty p{font-size:13px}
@media(max-width:900px){
 .cart-layout{grid-template-columns:1fr;gap:35px}
 .summary{position:static}
}
@media(max-width:800px){
 .menu a{display:none}
 .cart-page{padding:55px 18px 80px}
 .cart-item{grid-template-columns:100px 1fr;gap:15px}
 .placeholder{height:120px}
 .placeholder span{font-size:21px}
 .item-total{grid-column:2;text-align:left}
 .remove{margin-left:0}
 .cart-title{font-size:22vw}
}
</style>
</head>
<body>
<header class="top">
<div class="top-inner">
<a class="brand-center" href="index.html#home"><img src="./logo.png?v=20261004-2" alt="PayBac Iboro"></a>
<nav class="menu">
<a href="index.html#home">HOME</a>
<a href="index.html#gallery">GALLERY</a>
<a href="index.html#shop">MERCH</a>
<a href="cart.html">CART</a>
<a href="index.html#contact">CONTACT</a>
</nav>
</div>
</header>

<main class="cart-page">
<div class="cart-inner">
<div class="cart-head">
<div class="eyebrow">AFROSKANKIN</div>
<h1 class="cart-title">YOUR CART</h1>
</div>
<div id="cartContent"></div>
</div>
</main>

<script src="https://js.paystack.co/v2/inline.js"></script>
<script>

const PAYSTACK_PUBLIC_KEY = "pk_test_7b823b49d66194e611220241403553ece6077f71";
const productDefaults={
 'AFROSKANKIN Vinyl':{type:'Vinyl',label:'AFROSKANKIN VINYL'},
 'AFROSKANKIN Shirt':{type:'Shirt',label:'AFROSKANKIN SHIRT'},
 'Signature Tee':{type:'Shirt',label:'AFROSKANKIN SHIRT'},
 'AFROSKANKIN CD':{type:'CD',label:'AFROSKANKIN CD'},
 'AFROSKANKIN Book':{type:'Book',label:'AFROSKANKIN BOOK'},
 'Classic Hoodie':{type:'Hoodie',label:'AFROSKANKIN HOODIE'},
 'Embroidered Cap':{type:'Cap',label:'AFROSKANKIN CAP'}
};

let cart=JSON.parse(localStorage.getItem('afroskankinCart')||'[]');

cart=cart.map(x=>{
 const d=productDefaults[x.name]||{};
 return {...x,type:x.type||d.type||'Product',label:x.label||d.label||String(x.name||'AFROSKANKIN').toUpperCase(),size:x.size||'One Size',qty:Math.max(1,x.qty||1)};
});
localStorage.setItem('afroskankinCart',JSON.stringify(cart));

function save(){localStorage.setItem('afroskankinCart',JSON.stringify(cart))}
function money(n){return '₦'+Number(n||0).toLocaleString()}
function change(i,d){cart[i].qty=Math.max(1,(cart[i].qty||1)+d);save();render()}
function removeItem(i){cart.splice(i,1);save();render()}

const shippingRates=[
 {name:'Lekki',time:'within 3-5 Business days',price:9000},
 {name:'Ajah',time:'within 3-5 Business days',price:8000},
 {name:'Sangotedo',time:'within 3-5 Business days',price:8000},
 {name:'Ibeju/Epe',time:'within 3-5 Business days',price:15000},
 {name:'Shomolu, Bariga, Surulere, Mushin',time:'within 3-5 Business days',price:5000},
 {name:'Ikeja, Ketu, Mile12, Gbagada, Oworoshoki',time:'within 3-5 Business days',price:6000},
 {name:'Ogba, Agege, Egbeda, Apapa',time:'within 3-5 Business days',price:6000},
 {name:'Abule Egba, Fagba, Ayobo, Igando, Alakija',time:'within 3-5 Business days',price:7000},
 {name:'Ipaja, Ikotun, Ijegun, Festac, Mile 2, Ojodu Berger, Magodo',time:'within 3-5 Business days',price:5000},
 {name:'Abule Ado, LASU, Iba, Alaba',time:'within 3-5 Business days',price:6000},
 {name:'Ago Palace',time:'within 3-5 Business days',price:2000}
];

let selectedShipping=localStorage.getItem('afroskankinShipping')||'';
let deliveryAddress=JSON.parse(localStorage.getItem('afroskankinAddress')||'null');

function saveAddress(data){
 deliveryAddress=data;
 localStorage.setItem('afroskankinAddress',JSON.stringify(data));
}

function shippingPrice(){
 const selected=shippingRates.find(x=>x.name===selectedShipping);
 return selected?selected.price:0;
}

function selectShipping(name){
 selectedShipping=name;
 localStorage.setItem('afroskankinShipping',name);
 render();
}

function toggleAddress(){
 const form=document.getElementById('addressForm');
 if(form) form.classList.toggle('open');
}

function saveNewAddress(e){
 e.preventDefault();
 const form=e.currentTarget;
 saveAddress({
   fullName:form.fullName.value.trim(),
   phone:form.phone.value.trim(),
   address:form.address.value.trim(),
   city:form.city.value.trim()
 });
 form.classList.remove('open');
 render();
}

function applyCoupon(){
 const input=document.getElementById('couponCode');
 if(!input||!input.value.trim()){alert('Enter a coupon code.');return}
 alert('This coupon code is not available yet.');
}

function updateCart(){
 save();
 render();
}

function render(){
 const root=document.getElementById('cartContent');
 if(!cart.length){
   root.innerHTML='<div class="empty"><h2>YOUR CART IS EMPTY</h2><p>Choose something from the AFROSKANKIN merch collection.</p><a class="continue" href="index.html#shop">CONTINUE SHOPPING</a></div>';
   return;
 }

 const subtotal=cart.reduce((s,x)=>s+Number(x.price||0)*(x.qty||1),0);
 const dispatch=shippingPrice();
 const total=subtotal+dispatch;
 const addressText=deliveryAddress
   ? (deliveryAddress.fullName+' · '+deliveryAddress.phone+'<br>'+deliveryAddress.address+', '+deliveryAddress.city)
   : 'No delivery address selected.';

 root.innerHTML='<div class="cart-layout">'+
 '<section class="cart-items">'+
 cart.map((x,i)=>
 '<article class="cart-item">'+
 '<div class="placeholder"><span>'+x.label+'</span></div>'+
 '<div>'+
 '<div class="item-name">'+x.name+'</div>'+
 '<div class="item-type">'+x.type+' · '+x.size+'</div>'+
 '<div class="item-price">'+money(x.price)+'</div>'+
 '<div class="qty"><button aria-label="Decrease quantity" onclick="change('+i+',-1)">−</button><span>'+(x.qty||1)+'</span><button aria-label="Increase quantity" onclick="change('+i+',1)">+</button></div>'+
 '</div>'+
 '<div class="item-total">'+money(Number(x.price||0)*(x.qty||1))+'<button class="remove" onclick="removeItem('+i+')">Remove</button></div>'+
 '</article>'
 ).join('')+
 '</section>'+
 '<aside class="summary">'+
 '<h2>Order Summary</h2>'+
 '<div class="coupon-row"><input id="couponCode" placeholder="Coupon code"><button type="button" onclick="applyCoupon()">Apply Coupon</button></div>'+
 '<button class="update-cart" type="button" onclick="updateCart()">Update Cart</button>'+
 '<div class="shipping">'+
 '<h3>Shipment</h3>'+
 shippingRates.map((x)=>
 '<div class="shipping-option">'+
 '<input type="radio" name="shipping" id="ship-'+shippingRates.indexOf(x)+'" '+(selectedShipping===x.name?'checked':'')+' onchange="selectShipping(\''+x.name.replace(/'/g,"\\'")+'\')">'+
 '<label for="ship-'+shippingRates.indexOf(x)+'"><strong>'+x.name+' · '+money(x.price)+'</strong>'+x.time+'</label>'+
 '</div>'
 ).join('')+
 '<div class="address-box">'+
 '<div class="address-label">Delivery Address</div>'+
 '<div class="address-value">'+addressText+'</div>'+
 '<button class="change-address" type="button" onclick="toggleAddress()">Change Address</button>'+
 '<form class="address-form" id="addressForm" onsubmit="saveNewAddress(event)">'+
 '<input name="fullName" placeholder="Full Name" value="'+(deliveryAddress?.fullName||'')+'" required>'+
 '<input name="phone" placeholder="Phone" value="'+(deliveryAddress?.phone||'')+'" required>'+
 '<input name="address" placeholder="Address" value="'+(deliveryAddress?.address||'')+'" required>'+
 '<input name="city" placeholder="City" value="'+(deliveryAddress?.city||'')+'" required>'+
 '<button class="change-address" type="submit">Save Address</button>'+
 '</form>'+
 '</div>'+
 '</div>'+
 '<div class="sum-row"><span>Subtotal</span><span>'+money(subtotal)+'</span></div>'+
 '<div class="sum-row"><span>Shipment</span><span>'+(dispatch?money(dispatch):'Select location')+'</span></div>'+
 '<div class="sum-row sum-total"><span>Total</span><span>'+money(total)+'</span></div>'+
 '<div class="checkout">'+
 '<button class="pay" type="button" onclick="checkout()">PROCEED TO CHECKOUT</button>'+
 '<div class="checkout-note">Select a shipment location and delivery address before proceeding.</div>'+
 '</div>'+
 '<a class="continue" href="index.html#shop">Continue Shopping</a>'+
 '</aside>'+
 '</div>';
}

async function checkout(){
  if(!cart.length){
    alert('Your cart is empty.');
    return;
  }

  if(!selectedShipping){
    alert('Please select a shipment location.');
    return;
  }

  if(!deliveryAddress){
    alert('Please add your delivery address.');
    toggleAddress();
    return;
  }

  const email = prompt('Enter your email address:');

  if(!email){
    return;
  }

  try {
    const response = await fetch(
     'https://afroskankin.netlify.app/.netlify/functions/initialize-payment',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: email,

          items: cart.map(item => ({
            id: item.id,
            quantity: item.qty || 1
          })),

          shippingLocation: selectedShipping,

          customer: {
            fullName: deliveryAddress.fullName,
            phone: deliveryAddress.phone,
            address: deliveryAddress.address,
            city: deliveryAddress.city
          }
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || 'Unable to initialize payment.');
    }

    const paystack = new PaystackPop();

    paystack.resumeTransaction(data.access_code);

  } catch(error) {
    console.error('Payment initialization error:', error);

    alert(
      error.message ||
      'Payment could not be started. Please try again.'
    );
  }
}

render();
</script>
</body>
</html>
