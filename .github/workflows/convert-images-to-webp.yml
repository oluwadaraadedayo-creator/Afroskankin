name: Convert site images to WebP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-images-to-webp.yml'
      - 'scripts/convert_images_to_webp.py'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converter
        run: python -m pip install Pillow
      - name: Convert images and update local references
        run: python scripts/convert_images_to_webp.py
      - name: Commit WebP images and updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No WebP changes to commit."
          else
            git commit -m "Convert JPG and PNG assets to WebP"
            git push
          fi
