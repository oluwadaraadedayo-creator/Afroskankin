<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paystack Backend Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      background: #111;
      color: white;
    }

    button {
      padding: 14px 22px;
      background: #00c853;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      margin-top: 25px;
      padding: 20px;
      background: #222;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>Paystack Backend Test</h1>

  <p>
    This page tests the connection between Afroskankin,
    Netlify and Paystack.
  </p>

  <button onclick="testPayment()">
    TEST PAYSTACK BACKEND
  </button>

  <pre id="result">Waiting for test...</pre>

  <script>

    async function testPayment() {

      const result = document.getElementById("result");

      result.textContent = "Connecting to Netlify...";

      try {

        const response = await fetch(
          "https://afroskankin.netlify.app/.netlify/functions/initialize-payment",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              email: "test@example.com",

              // ₦1,000 expressed in kobo
              amount: 100000,

              metadata: {
                test: true,
                source: "afroskankin-backend-test"
              }

            })
          }
        );

        const data = await response.json();

        result.textContent =
          JSON.stringify(data, null, 2);

      } catch (error) {

        result.textContent =
          "ERROR:\n\n" + error.message;

        console.error(error);
      }
    }

  </script>

</body>
</html>
